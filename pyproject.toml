[project]
name = "booko"
version = "0.1.0"
description = "Telegram bot that files books onto shelves and catalogs them in Notion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20.0",
    "notion-client>=2.3.0",
    "python-dotenv>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = ["filing.py", "settings.py", "notion_catalog.py", "cli.py", "bot.py"]
tests_dir = ["tests/"]
also_copy = ["tests/"]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "mutmut>=3.8.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "radon>=6.0.1",
]
